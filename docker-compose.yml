services:
  app:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Set MOCK_AI=true in .env to skip real OpenAI calls during review
      MOCK_AI: "${MOCK_AI:-false}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/data/documents"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
