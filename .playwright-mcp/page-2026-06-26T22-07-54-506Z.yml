              - textbox "Start writing…" [ref=e310]: • Unify AI drafting, review, and human collaboration in one workspace. • Make AI suggestions visible, reviewable, and actionable. • Preserve a clear history of decisions and changes. • Improve documentation quality and speed by at least 30%, measured by time-to-publish and reviewer satisfaction scores.
