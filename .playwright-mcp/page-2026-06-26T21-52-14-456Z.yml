        - generic [ref=e197]:
          - generic [ref=e335]:
            - heading "1. Problem" [level=2] [ref=e336]
            - textbox "Start writing…" [ref=e337]: Teams create documents using AI in one tool and then paste them into another for collaboration and review. This creates friction, context switching, and version drift.
          - generic [ref=e338]:
            - generic [ref=e339]:
              - heading "2. Goals" [level=2] [ref=e340]
              - textbox "Start writing…" [ref=e341]: • Unify AI drafting, review, and human collaboration in one workspace. • Make AI suggestions visible, reviewable, and actionable. • Preserve a clear history of decisions and changes. • Improve quality and speed of documentation.
            - button "R AI Reviewer 10 min ago Consider adding measurable success criteria. What does \"improve quality and speed\" mean for this project?" [ref=e344]:
              - generic [ref=e345]:
                - generic [ref=e346]: R
                - generic [ref=e347]: AI Reviewer
                - generic [ref=e348]: 10 min ago
              - paragraph [ref=e349]: Consider adding measurable success criteria. What does "improve quality and speed" mean for this project?
          - generic [ref=e351]:
            - heading "3. Proposed Solution" [level=2] [ref=e352]
            - textbox "Start writing…" [ref=e353]: A collaborative editor where AI agents can draft content, critique it, and suggest improvements inline. Humans retain full control to accept or reject changes.
          - generic [ref=e355]:
            - heading "4. Architecture" [level=2] [ref=e356]
            - textbox "Start writing…" [ref=e357]: Web App (React) → AI Service → Document Store (PostgreSQL)
          - generic [ref=e359]:
            - heading "5. Risks & Mitigations" [level=2] [ref=e360]
            - textbox "Start writing…" [ref=e361]: • Ensure documents are encrypted and access is scoped. • Over-reliance on AI – Keep humans in the loop for final decisions.
