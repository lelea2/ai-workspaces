        - generic [ref=e197]:
          - generic [ref=e199]:
            - heading "1. Problem" [level=2] [ref=e200]
            - textbox "Start writing…" [ref=e201]: Teams create documents using AI in one tool and then paste them into another for collaboration and review. This creates friction, context switching, and version drift.
          - generic [ref=e202]:
            - generic [ref=e203]:
              - heading "2. Goals" [level=2] [ref=e204]
              - textbox "Start writing…" [ref=e205]: • Unify AI drafting, review, and human collaboration in one workspace. • Make AI suggestions visible, reviewable, and actionable. • Preserve a clear history of decisions and changes. • Improve documentation quality and speed by at least 30%, measured by time-to-publish and reviewer satisfaction scores.
            - button "R AI Reviewer 3 min ago Consider adding measurable success criteria. What does \"improve quality and speed\" mean for this project?" [ref=e208]:
              - generic [ref=e209]:
                - generic [ref=e210]: R
                - generic [ref=e211]: AI Reviewer
                - generic [ref=e212]: 3 min ago
              - paragraph [ref=e213]: Consider adding measurable success criteria. What does "improve quality and speed" mean for this project?
          - generic [ref=e215]:
            - heading "3. Proposed Solution" [level=2] [ref=e216]
            - textbox "Start writing…" [ref=e217]: A collaborative editor where AI agents can draft content, critique it, and suggest improvements inline. Humans retain full control to accept or reject changes.
          - generic [ref=e219]:
            - heading "4. Architecture" [level=2] [ref=e220]
            - textbox "Start writing…" [ref=e221]: Web App (React) → AI Service → Document Store (PostgreSQL)
          - generic [ref=e223]:
            - heading "5. Risks & Mitigations" [level=2] [ref=e224]
            - textbox "Start writing…" [ref=e225]: • Ensure documents are encrypted and access is scoped. • Over-reliance on AI – Keep humans in the loop for final decisions.
